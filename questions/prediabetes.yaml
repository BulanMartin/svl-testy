    question: "Jaký je vztah prediabetu k diabetu 2. typu?"
    options:
      - id: "a"
        text: "Jde o rizikový stav, který může být reverzibilní."
      - id: "b"
        text: "Jde vždy o nevratnou formu manifestního diabetu."
      - id: "c"
        text: "Jde o stav s nižším kardiovaskulárním rizikem než normoglykemie."
