    type: "single_choice"
    question: "Patří pacient s již diagnostikovanou a léčenou osteoporózou do screeningového programu popsaného v doplňku?"
    options:
      - id: "a"
        text: "Ne, jde již o sledování známého onemocnění."
      - id: "b"
        text: "Ano, při každé preventivní prohlídce."
      - id: "c"
        text: "Ano, pokud je bez nové zlomeniny."
    correct_option_id: "a"
